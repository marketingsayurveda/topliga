<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #08080a;
    background-image:
      radial-gradient(900px 520px at 78% 12%, rgba(242,107,33,.30), transparent 62%),
      radial-gradient(620px 420px at 8% 96%, rgba(201,79,16,.22), transparent 66%);
    font-family: "Inter", sans-serif;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .stripe { position: absolute; left: 0; right: 0; height: 10px; background: #f26b21; }
  .stripe--top { top: 0; }
  .in { padding: 64px 72px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }

  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 62px; height: 71px; object-fit: contain; }
  .brand__txt { font-family: "Anton", sans-serif; font-size: 44px; letter-spacing: .5px; line-height: 1; }
  .brand__txt i { font-style: normal; color: #f26b21; }
  .brand__txt small { display: block; font-family: "Inter", sans-serif; font-size: 15px;
    font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #a2a2ad; margin-top: 7px; }

  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #f26b21; }
  h1 { font-family: "Anton", sans-serif; font-size: 92px; line-height: .98; letter-spacing: .5px;
    text-transform: uppercase; margin: 22px 0 26px; max-width: 1000px; }
  h1 span { color: #f26b21; }
  .lead { font-size: 28px; font-weight: 600; color: #d6d6de; }

  .facts { display: flex; gap: 46px; align-items: flex-end; }
  .fact b { display: block; font-family: "Anton", sans-serif; font-size: 46px; line-height: 1; }
  .fact span { display: block; font-size: 16px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: #a2a2ad; margin-top: 9px; }
  .fact--hot b { color: #f26b21; }
</style>
</head>
<body>
  <div class="stripe stripe--top"></div>
  <div class="in">
    <div class="brand">
      <img src="znak.png" alt="">
      <span class="brand__txt">TOP <i>LIGA</i><small>v malom futbale</small></span>
    </div>

    <div>
      <p class="eyebrow">Jeseň 2026 · Bratislava · 25. sezóna</p>
      <h1>Registrácie sú <span>otvorené</span></h1>
      <p class="lead">Prihlás tím do 31. 8. Súťaž štartuje 14. 9.</p>
    </div>

    <div class="facts">
      <div class="fact"><b>120</b><span>tímov</span></div>
      <div class="fact"><b>min. 9</b><span>zápasov</span></div>
      <div class="fact"><b>2 × 25</b><span>minút</span></div>
      <div class="fact fact--hot"><b>529 €</b><span>do 17. 8.</span></div>
    </div>
  </div>
</body>
</html>
